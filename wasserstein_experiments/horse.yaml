# Model/data/optimizer/evaluation match horse_experiments/horse_nsot_n256_seed0.yaml.
# Only coupling changes; bank M=2048 is NOT NSOT's M=10000.
dataset: horse
seed: 0
device: cuda
dtype: float32
coupling: wasserstein_bank
wasserstein_bank:
  cache: auto
  cache_seed: 0
  superset_size: 2048
  selector: joint
  backend: exact
  pool_per_shape: 256
  subset_size: 32
  scales: [8, 32, 128]
  repetitions: 8
  projections: 32
  velocity_weight: 1.0
  alpha_values: [0.25, 0.5, 1.0, 2.0, 4.0]
  joint_times: [0.0]
  variance_times: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
  bandwidths: [0.05, 0.1, 0.2]
  variance_bandwidth: 0.1
  max_cost_mib: 512
data:
  batch_size: 64
  n_points: 256
model:
  point_dim: 2
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.0
training:
  num_steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.01
  log_every: 100
  validation_batch_size: 16
evaluation:
  batch_size: 64
checkpoint: horse_wasserstein_bank.pt
