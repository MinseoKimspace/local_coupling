# Same model, data, training and evaluation as horse_experiments/horse_nsot_n256_seed0.yaml.
dataset: horse
seed: 0
device: cuda
dtype: float32
coupling: multiscale_wasserstein

multiscale_wasserstein:
  cache: coupling_cache/multiscale_wasserstein/horse_m10000_seed0.npz
  superset_size: 10000
  cache_seed: 0
  partition_counts: [4, 20, 100]
  scale_weights: [1.0, 1.0, 1.0]
  max_cost_mib: 512

data:
  batch_size: 64
  n_points: 256

model:
  point_dim: 2
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: horse_multiscale_wasserstein.pt
