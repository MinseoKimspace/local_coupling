# Experimental fine-pairing change only. Original Hard bank is never modified.
# L=1 is a supervision-conflict budget, NOT a 1-Lipschitz model constraint.
seed: 0
device: cuda
dtype: float32
coupling: target_guided_cached
num_regions: 8

tg_cache:
  base_path: coupling_cache/checkerboard_tg_hard_k8_n256_seed0
  path: coupling_cache/checkerboard_tg_untangle_k8_n256_seed0
  sampling: bank
  num_clouds: 4096
  seed: 0
  prepare_batch_size: 64
  num_workers: 2
  untangle:
    enabled: true
    neighbors: 8
    times: [0.05, 0.15, 0.30]
    lipschitz: 1.0
    permutations: 4
    swap_steps: 64
    seed: 0

data:
  batch_size: 64
  n_points: 256
  grid_size: 4

model:
  point_dim: 2
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.001
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: target_guided_cached_untangle_k8_n256_seed0.pt
