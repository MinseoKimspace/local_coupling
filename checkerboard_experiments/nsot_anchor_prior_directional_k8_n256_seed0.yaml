# Same anchor prior and exact OT pair cache as the isotropic anchor-NSOT control.
# Only component-centered hybrid noise changes; fit a fixed directional sidecar once.
# Experimental coupling variant, not a guarantee of 1-step quality or thin-structure preservation.
seed: 0
device: cuda
dtype: float32
coupling: nsot
num_regions: 8

anchor_flow:
  mode: anchor_prior
  sigma: 0.1
  reference_points: 4096
  seed: 0

nsot:
  cache: coupling_cache/nsot/checkerboard_anchor_prior_k8_m10000_seed0.npz
  superset_size: 10000
  cache_seed: 0
  beta: 0.2
  solver: scipy_linear_sum_assignment
  directional_hybrid:
    artifact: coupling_cache/nsot/checkerboard_anchor_prior_k8_m10000_seed0_directional.json
    strength: 0.9
    ridge: 0.001
    min_points: 32
    min_target_anisotropy: 1.5
    min_normal_r2: 0.25

data:
  batch_size: 64
  n_points: 256
  grid_size: 4

model:
  point_dim: 2
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.001
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: nsot_anchor_prior_directional_k8_n256_seed0.pt
