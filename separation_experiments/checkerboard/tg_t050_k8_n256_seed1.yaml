seed: 1
device: cuda
dtype: float32
coupling: target_guided_separation
num_regions: 8

separation:
  time: 0.5
  margin_fraction: 0.25
  weight: 10.0
  min_target_gap: 0.000001

data:
  batch_size: 64
  n_points: 256
  grid_size: 4

model:
  point_dim: 2
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.001
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: checkerboard_tg_separation_t050_k8_n256_seed1.pt
