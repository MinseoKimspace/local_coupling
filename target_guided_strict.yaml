seed: 0
device: cuda
dtype: float32
coupling: target_guided_strict

data:
  batch_size: 16
  n_points: 256
  grid_size: 4

model:
  point_dim: 2
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.001
  weight_decay: 0.01
  log_every: 100

checkpoint: model_target_guided_strict.pt
