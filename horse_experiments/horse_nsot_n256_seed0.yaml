# Paper-based 2D NSOT exact-superset setting, NOT author code/main 100K results.
# Model/training/evaluation are identical to horse_minibatch_ot_n256_seed0.yaml.
# Finite cached targets replace online fresh targets; report this adaptation.
seed: 0
device: cuda
dtype: float32
coupling: nsot

nsot:
  cache: coupling_cache/nsot/horse_m10000_seed0.npz
  superset_size: 10000
  cache_seed: 0
  beta: 0.2
  solver: scipy_linear_sum_assignment

data:
  batch_size: 64
  n_points: 256

model:
  point_dim: 2
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: horse_nsot_n256_seed0.pt
