# Ordinary fitted GMM: learned weights, means and full 2D covariances.
# Experimental prior-changing NSOT extension; not original Gaussian-prior NSOT.
seed: 0
device: cuda
dtype: float32
coupling: nsot
num_regions: 8

anchor_flow:
  mode: gmm_prior
  reference_points: 4096
  seed: 0
  n_init: 5
  max_iter: 300
  tol: 0.0001
  reg_covar: 0.000001

nsot:
  cache: coupling_cache/nsot/horse_gmm_full_prior_k8_m10000_seed0.npz
  superset_size: 10000
  cache_seed: 0
  beta: 0.2
  solver: scipy_linear_sum_assignment

data:
  batch_size: 64
  n_points: 256

model:
  point_dim: 2
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.0

training:
  num_steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.01
  log_every: 100

evaluation:
  batch_size: 64

checkpoint: horse_nsot_gmm_full_prior_k8_n256_seed0.pt
